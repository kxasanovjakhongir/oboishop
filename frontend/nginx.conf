server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip — the gateway also compresses, but this makes the image usable
    # standalone (docker run -p 80:80) without the gateway in front.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA rewrite — any path that isn't a real file falls back to index.html
    # so React Router's client-side routes (e.g. /product/123) work on
    # direct load/refresh instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (vendor-*.js, index-*.css, ...) are safe to cache
    # forever — Vite gives each a content hash, so a new deploy means a new
    # filename, never a stale cache serving old code.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public";
    }
}
