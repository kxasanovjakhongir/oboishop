# Mounted directly into /etc/nginx/conf.d/ (not templates/), so nginx
# includes it verbatim inside the http{} block from the base image's
# stock nginx.conf — this is the only way to set an http-context directive
# without replacing that whole file.
#
# server_names_hash_bucket_size: the default (32 on most builds) is too
# small once you add multiple real subdomains (oboishop.uz, www.oboishop.uz,
# admin.oboishop.uz, api.oboishop.uz) — nginx fails to start with
# "could not build server_names_hash, you should increase
# server_names_hash_bucket_size" once the combined length crosses that
# default. 64 covers this project's domains with headroom.
server_names_hash_bucket_size 64;
